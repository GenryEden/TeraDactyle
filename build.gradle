plugins {
	id 'java'
	id 'org.springframework.boot' version '3.3.1'
	id 'io.spring.dependency-management' version '1.1.5'
	id 'org.asciidoctor.jvm.convert' version '3.3.2'
}

group = 'ru.kernelpunik'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
	maven {
		url "https://oss.sonatype.org/content/repositories/snapshots/"
	}
}

ext {
	set('snippetsDir', file("build/generated-snippets"))
}

dependencies {
	//    tree sitter
	implementation 'io.github.bonede:tree-sitter:0.24.4'
	//    python parser
	implementation 'io.github.bonede:tree-sitter-python:0.23.4'
	//    c++ parser
	implementation "io.github.bonede:tree-sitter-cpp:0.23.4"
	//    java parser
	implementation "io.github.bonede:tree-sitter-java:0.23.4"
	implementation "net.lingala.zip4j:zip4j:1.3.2"
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	compileOnly 'org.projectlombok:lombok'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
//	developmentOnly 'org.springframework.boot:spring-boot-docker-compose'
	implementation 'org.soot-oss:soot:4.5.0'

//	implementation 'org.soot-oss:soot-infoflow:4.5.0'
//  For PDG support, include jimple-based IDE packages if needed
//    implementation 'ca.mcgill.sable:batik:1.12'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.restdocs:spring-restdocs-mockmvc'
	testImplementation 'com.h2database:h2'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

}

jar {
	manifest {
		attributes 'Main-Class': 'ru.kernelpunik.teradactyle.TeradactyleApplication'
	}
}

tasks.named('test') {
	outputs.dir snippetsDir
	maxHeapSize = "4096m"
	useJUnitPlatform()
}

tasks.named('asciidoctor') {
	inputs.dir snippetsDir
	dependsOn test
}
